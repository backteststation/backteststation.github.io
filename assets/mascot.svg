<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" role="img" aria-label="Our technician leaning in to study a surprised trading bot through a magnifying glass">
  <!-- The logo tile as a technician (logo cap, orange overalls) leaning in with a 3D magnifying glass over a trading bot -->
  <defs>
    <linearGradient id="m-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4fa3"/>
      <stop offset="1" stop-color="#0f2152"/>
    </linearGradient>
    <linearGradient id="m-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0f5"/>
      <stop offset=".45" stop-color="#2f5bbf"/>
      <stop offset="1" stop-color="#0f2152"/>
    </linearGradient>
    <radialGradient id="m-glass" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#cfe0ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7fa6ff" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="m-handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset=".5" stop-color="#1b1f27"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <clipPath id="m-lens"><circle cx="214" cy="126" r="14.5"/></clipPath>
  </defs>
  <ellipse cx="135" cy="200" rx="112" ry="6" fill="#000" opacity=".08"/>

  <!-- the trading bot, surprised, waiting to be checked -->
  <g>
    <line x1="206" y1="112" x2="206" y2="100" stroke="#8a96a6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="206" cy="97" r="5" fill="#e5484d"/>
    <path d="M238 96 L236 108" stroke="#e5484d" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="235.3" cy="113.5" r="1.9" fill="#e5484d"/>
    <rect x="182" y="112" width="48" height="36" rx="9" fill="#d5dbe3" stroke="#8a96a6" stroke-width="2"/>
    <rect x="188" y="117" width="36" height="26" rx="5" fill="#0e1116"/>
    <path d="M193 122 Q197 119 201 121" fill="none" stroke="#e7ebf0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="197" cy="128" r="4" fill="#ffffff"/><circle cx="196" cy="128.5" r="1.8" fill="#0e1116"/>
    <ellipse cx="206" cy="137.5" rx="2.6" ry="3" fill="none" stroke="#e7ebf0" stroke-width="1.6"/>
    <rect x="188" y="152" width="36" height="30" rx="7" fill="#d5dbe3" stroke="#8a96a6" stroke-width="2"/>
    <polyline points="194,174 200,167 205,170 212,161 218,164" fill="none" stroke="#1f8a4c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="193" y="182" width="9" height="12" rx="3" fill="#8a96a6"/>
    <rect x="210" y="182" width="9" height="12" rx="3" fill="#8a96a6"/>
    <path d="M224 160 L236 152" stroke="#8a96a6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="238" cy="150" r="4" fill="#8a96a6"/>
    <path d="M188 162 L180 170" stroke="#8a96a6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- technician, leaning in towards the bot -->
  <g transform="rotate(9 88 192) translate(6 0)">
    <rect x="62" y="152" width="15" height="34" rx="5" fill="#e8912a"/>
    <rect x="99" y="152" width="15" height="34" rx="5" fill="#e8912a"/>
    <rect x="56" y="183" width="25" height="12" rx="6" fill="#16306e"/>
    <rect x="95" y="183" width="25" height="12" rx="6" fill="#16306e"/>

    <path d="M44 118 Q24 130 34 148" fill="none" stroke="#1f3f8a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="35" cy="149" r="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>

    <rect x="40" y="62" width="96" height="96" rx="24" fill="url(#m-g)"/>

    <!-- focused face, both eyes on the lens -->
    <ellipse cx="77" cy="94" rx="9" ry="10" fill="#ffffff"/>
    <ellipse cx="105" cy="94" rx="9" ry="10" fill="#ffffff"/>
    <circle cx="82" cy="95" r="4.6" fill="#0e1116"/>
    <circle cx="110" cy="95" r="4.6" fill="#0e1116"/>
    <circle cx="83.5" cy="93.3" r="1.4" fill="#ffffff"/>
    <circle cx="111.5" cy="93.3" r="1.4" fill="#ffffff"/>
    <path d="M67.5 90 Q77 85.5 86.5 90 L86.5 83 H67.5 Z" fill="#1d3a80"/>
    <path d="M95.5 90 Q105 85.5 114.5 90 L114.5 83 H95.5 Z" fill="#1d3a80"/>
    <path d="M68 80.5 Q76 78.5 85 81.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M97 79.5 Q106 77 114 80" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="96" cy="111" rx="3.2" ry="2.6" fill="#ffffff"/>

    <!-- overalls -->
    <path d="M60 124 L46 100" stroke="#e8912a" stroke-width="7" stroke-linecap="round"/>
    <path d="M116 124 L130 100" stroke="#e8912a" stroke-width="7" stroke-linecap="round"/>
    <path d="M56 120 H120 V146 Q120 158 108 158 H68 Q56 158 56 146 Z" fill="#f2a33a"/>
    <circle cx="63" cy="126" r="3.2" fill="#ffffff"/>
    <circle cx="113" cy="126" r="3.2" fill="#ffffff"/>
    <rect x="76" y="128" width="24" height="20" rx="4" fill="#e8912a"/>
    <g stroke="#16306e" stroke-width="1.6" stroke-linecap="round">
      <line x1="82" y1="137" x2="82" y2="146"/><line x1="88" y1="133" x2="88" y2="143"/><line x1="94" y1="130" x2="94" y2="139"/>
    </g>
    <g fill="#16306e">
      <rect x="80.3" y="138.5" width="3.4" height="5" rx=".8"/><rect x="86.3" y="134.5" width="3.4" height="5" rx=".8"/>
      <rect x="92.3" y="131" width="3.4" height="5" rx=".8"/>
    </g>

    <!-- mechanic's cap with our logo -->
    <path d="M48 70 Q50 40 88 38 Q126 40 128 70 Z" fill="#16306e"/>
    <path d="M112 64 Q140 60 152 70 L116 72 Z" fill="#0f2453"/>
    <rect x="46" y="64" width="84" height="9" rx="4.5" fill="#0f2453"/>
    <rect x="79" y="43" width="18" height="18" rx="5" fill="#2a4fa3" stroke="#ffffff" stroke-width="1"/>
    <path d="M82.5 52.5 A6 6 0 1 1 84.3 56.8" fill="none" stroke="#7fa6ff" stroke-width="1.3" stroke-linecap="round"/>
    <g fill="#ffffff">
      <rect x="84.5" y="53" width="2.2" height="3.5" rx=".5"/><rect x="87.4" y="51" width="2.2" height="3.5" rx=".5"/>
      <rect x="90.3" y="49" width="2.2" height="3.5" rx=".5"/>
    </g>
  </g>

  <!-- right arm reaching out with the magnifying glass -->
  <path d="M140 132 Q160 146 178 147" fill="none" stroke="#1f3f8a" stroke-width="10" stroke-linecap="round"/>
  <!-- handle with grip and metal collar -->
  <g transform="rotate(-32 191 141)">
    <rect x="172" y="137" width="26" height="8" rx="4" fill="url(#m-handle)"/>
    <line x1="177" y1="138.5" x2="177" y2="143.5" stroke="#4a505c" stroke-width="1"/>
    <line x1="181" y1="138.5" x2="181" y2="143.5" stroke="#4a505c" stroke-width="1"/>
    <line x1="185" y1="138.5" x2="185" y2="143.5" stroke="#4a505c" stroke-width="1"/>
    <rect x="196" y="136" width="5" height="10" rx="1.5" fill="#b8c2d0" stroke="#7d8798" stroke-width=".8"/>
  </g>
  <circle cx="179" cy="147" r="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.5"/>
  <!-- lens: thick rim seen slightly from the side, the bot's eye magnified inside -->
  <circle cx="216.5" cy="128.5" r="17.5" fill="#0b1a3d"/>
  <g clip-path="url(#m-lens)">
    <rect x="186" y="110" width="50" height="40" fill="#0e1116"/>
    <path d="M206 116 Q213 111 221 115" fill="none" stroke="#e7ebf0" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="214" cy="128" r="8" fill="#ffffff"/>
    <circle cx="211" cy="129" r="3.8" fill="#0e1116"/>
    <circle cx="212.5" cy="127.3" r="1.2" fill="#ffffff"/>
  </g>
  <circle cx="214" cy="126" r="14.5" fill="url(#m-glass)"/>
  <circle cx="214" cy="126" r="15.5" fill="none" stroke="url(#m-rim)" stroke-width="4.5"/>
  <path d="M204 118 Q207 112 214 111" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <circle cx="222" cy="134" r="1.6" fill="#ffffff" opacity=".7"/>
</svg>
