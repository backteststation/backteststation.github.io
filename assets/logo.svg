<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Backtest Station">
  <!-- Backtest Station mark: three rising candles inside a "rewind" ring = we replay the past -->
  <defs>
    <linearGradient id="bs-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3f8a"/>
      <stop offset="1" stop-color="#0a1633"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bs-g)"/>
  <!-- rewind ring (like a "history" icon): open circle, arrowhead on the left pointing back in time -->
  <g opacity=".6" fill="#7fa6ff">
    <path d="M12 31 A20 20 0 1 1 17.9 46.1" fill="none" stroke="#7fa6ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M5.5 28.5 L18.5 28.5 L12 37.5 Z" stroke="#7fa6ff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- candles -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <line x1="23" y1="31" x2="23" y2="47"/>
    <line x1="32" y1="25" x2="32" y2="42"/>
    <line x1="41" y1="19" x2="41" y2="36"/>
  </g>
  <g fill="#ffffff">
    <rect x="19.5" y="34" width="7" height="10" rx="1.6"/>
    <rect x="28.5" y="28" width="7" height="10" rx="1.6"/>
    <rect x="37.5" y="22" width="7" height="10" rx="1.6"/>
  </g>
</svg>
